sensor:
  # ============================================================================
  # EATON 9PX UPS - SNMP SENSORS (0.1 V / 0.1 Hz / 0.1 A Precision)
  # Replace '192.168.1.100' with your UPS IP address.
  # ============================================================================

  # Operating Status (XUPS-MIB)
  - platform: snmp
    scan_interval: 10
    name: eaton_ups_status
    host: 192.168.1.100
    community: public
    baseoid: 1.3.6.1.4.1.534.1.4.5.0
    accept_errors: true
    value_template: >-
      {% set states = {
        '1': 'Other',
        '2': 'None',
        '3': 'Normal (Online)',
        '4': 'Bypass',
        '5': 'On Battery',
        '6': 'Booster',
        '7': 'Reducer',
        '8': 'Parallel Capacity',
        '9': 'Parallel Redundant',
        '10': 'High Efficiency (ECO)'
      } %}
      {{ states.get(value, 'Unknown (' ~ value ~ ')') }}

  # Battery State of Charge (%) - RFC1628
  - platform: snmp
    scan_interval: 15
    name: eaton_ups_battery_soc
    host: 192.168.1.100
    community: public
    baseoid: 1.3.6.1.2.1.33.1.2.4.0
    accept_errors: true
    unit_of_measurement: "%"
    device_class: battery
    state_class: measurement

  # Estimated Runtime Remaining (min) - RFC1628
  - platform: snmp
    scan_interval: 15
    name: eaton_ups_runtime_remaining
    host: 192.168.1.100
    community: public
    baseoid: 1.3.6.1.2.1.33.1.2.3.0
    accept_errors: true
    unit_of_measurement: "min"
    device_class: duration
    state_class: measurement

  # Output Active Power (W) - RFC1628
  - platform: snmp
    scan_interval: 10
    name: eaton_ups_output_power
    host: 192.168.1.100
    community: public
    baseoid: 1.3.6.1.2.1.33.1.4.4.1.4.1
    accept_errors: true
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement

  # Output Apparent Power (VA) - XUPS-MIB
  - platform: snmp
    scan_interval: 10
    name: eaton_ups_apparent_power
    host: 192.168.1.100
    community: public
    baseoid: 1.3.6.1.4.1.534.1.4.4.1.4.1
    accept_errors: true
    unit_of_measurement: "VA"
    device_class: apparent_power
    state_class: measurement

  # Output Load Percentage (%) - RFC1628
  - platform: snmp
    scan_interval: 10
    name: eaton_ups_load_percentage
    host: 192.168.1.100
    community: public
    baseoid: 1.3.6.1.2.1.33.1.4.4.1.5.1
    accept_errors: true
    unit_of_measurement: "%"
    state_class: measurement

  # Input Voltage (0.1 V resolution) - Eaton PowerChain MIB
  - platform: snmp
    scan_interval: 10
    name: eaton_ups_input_voltage
    host: 192.168.1.100
    community: public
    baseoid: 1.3.6.1.4.1.534.10.2.2.2.1.2.1
    accept_errors: true
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    value_template: "{{ ((value | float) / 10) | round(1) }}"

  # Output Voltage (0.1 V resolution) - Eaton PowerChain MIB
  - platform: snmp
    scan_interval: 10
    name: eaton_ups_output_voltage
    host: 192.168.1.100
    community: public
    baseoid: 1.3.6.1.4.1.534.10.2.2.3.1.0
    accept_errors: true
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    value_template: "{{ ((value | float) / 10) | round(1) }}"

  # Battery DC Voltage (0.1 V resolution) - RFC1628
  - platform: snmp
    scan_interval: 15
    name: eaton_ups_battery_voltage
    host: 192.168.1.100
    community: public
    baseoid: 1.3.6.1.2.1.33.1.2.5.0
    accept_errors: true
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    value_template: "{{ ((value | float) / 10) | round(1) }}"

  # Output Frequency (0.1 Hz resolution) - RFC1628
  - platform: snmp
    scan_interval: 15
    name: eaton_ups_frequency
    host: 192.168.1.100
    community: public
    baseoid: 1.3.6.1.2.1.33.1.4.2.0
    accept_errors: true
    unit_of_measurement: "Hz"
    device_class: frequency
    state_class: measurement
    value_template: "{{ ((value | float) / 10) | round(1) }}"

  # Output Current (0.1 A resolution) - RFC1628
  - platform: snmp
    scan_interval: 10
    name: eaton_ups_output_current
    host: 192.168.1.100
    community: public
    baseoid: 1.3.6.1.2.1.33.1.4.4.1.3.1
    accept_errors: true
    unit_of_measurement: "A"
    device_class: current
    state_class: measurement
    value_template: "{{ ((value | float) / 10) | round(1) }}"

  # UPS / Ambient Temperature (°C) - XUPS-MIB
  - platform: snmp
    scan_interval: 30
    name: eaton_ups_temperature
    host: 192.168.1.100
    community: public
    baseoid: 1.3.6.1.4.1.534.1.6.1.0
    accept_errors: true
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement

  # Active Alarms Count - XUPS-MIB
  - platform: snmp
    scan_interval: 30
    name: eaton_ups_alarms
    host: 192.168.1.100
    community: public
    baseoid: 1.3.6.1.4.1.534.1.7.1.0
    accept_errors: true
    state_class: measurement


# ==============================================================================
# OPTIONAL: CALCULATED UPS OVERHEAD / SELF-CONSUMPTION (W)
# Subtracts UPS output power from upstream smart plug wall power.
# Replace 'sensor.ups_wall_plug_power' with your smart plug entity ID.
# ==============================================================================
template:
  - sensor:
      - name: "Eaton UPS Own Consumption"
        unique_id: eaton_ups_own_consumption
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        state: >
          {% set grid = states('sensor.ups_wall_plug_power') | float(0) %}
          {% set load = states('sensor.eaton_ups_output_power') | float(0) %}
          {{ [0, (grid - load)] | max | round(1) }}
        availability: >
          {{ has_value('sensor.ups_wall_plug_power') and has_value('sensor.eaton_ups_output_power') }}
