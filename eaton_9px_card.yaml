type: entities
title: Eaton 9PX UPS
show_header_toggle: false
state_color: true
entities:
  - entity: sensor.eaton_9px_status
    name: Status
    icon: mdi:battery-charging
  - entity: sensor.eaton_9px_battery_soc
    name: Battery Charge
    icon: mdi:battery
  - entity: sensor.eaton_9px_runtime_remaining
    name: Estimated Runtime
    icon: mdi:timer-sand
  - entity: sensor.eaton_9px_temperature
    name: Temperature
    icon: mdi:thermometer
  - type: divider
  # Uncomment the line below if using an upstream smart plug for wall input power:
  # - entity: sensor.ups_wall_plug_power
  #   name: Wall Input Power
  #   icon: mdi:power-socket-eu
  - entity: sensor.eaton_9px_output_power
    name: Output Active Power
    icon: mdi:flash
  # Uncomment the line below if using the calculated own consumption template sensor:
  # - entity: sensor.eaton_9px_own_consumption
  #   name: UPS Own Consumption
  #   icon: mdi:transmission-tower
  - entity: sensor.eaton_9px_apparent_power
    name: Apparent Power
    icon: mdi:lightning-bolt
  - entity: sensor.eaton_9px_load_percentage
    name: Load
    icon: mdi:gauge
  - entity: sensor.eaton_9px_output_current
    name: Output Current
    icon: mdi:current-ac
  - type: divider
  - entity: sensor.eaton_9px_input_voltage
    name: Input Voltage
    icon: mdi:sine-wave
  - entity: sensor.eaton_9px_output_voltage
    name: Output Voltage
    icon: mdi:power-plug
  - entity: sensor.eaton_9px_frequency
    name: Output Frequency
    icon: mdi:waveform
  - entity: sensor.eaton_9px_battery_voltage
    name: Battery Voltage (DC)
    icon: mdi:car-battery
  - type: divider
  - entity: sensor.eaton_9px_alarms
    name: Active Alarms
    icon: mdi:alert-circle-outline
